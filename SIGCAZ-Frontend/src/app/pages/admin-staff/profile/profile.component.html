<div class="profile-view">
  <h1 class="profile-title">Mi perfil</h1>
  <p class="profile-subtitle">Consulta y edita tu información de usuario</p>

  <p class="empty-msg" *ngIf="loading">Cargando información del perfil...</p>

  <ng-container *ngIf="!loading">
    <!-- Encabezado -->
    <section class="profile-card profile-card--header">
      <div class="profile-header">
        <div class="profile-avatar">
          <i class="bi bi-person-circle"></i>
        </div>
        <div class="profile-header-info">
          <h2 class="profile-name">{{ name }}</h2>
          <span class="badge" [class.badge--admin]="role === 'admin'">{{ roleLabel }}</span>
          <p class="member-since" *ngIf="memberSince">
            <i class="bi bi-calendar3"></i> Miembro desde {{ memberSince }}
          </p>
        </div>
      </div>
    </section>

    <!-- Información personal -->
    <section class="profile-card">
      <h2 class="card-title"><i class="bi bi-person-vcard"></i> Información personal</h2>

      <div class="form-grid">
        <div class="field">
          <label><i class="bi bi-person"></i> Nombre completo</label>
          <input type="text" [(ngModel)]="name" placeholder="Nombre completo">
        </div>

        <div class="field">
          <label><i class="bi bi-envelope"></i> Correo electrónico</label>
          <input type="email" [(ngModel)]="email" placeholder="correo@ejemplo.com">
        </div>

        <div class="field">
          <label><i class="bi bi-telephone"></i> Teléfono</label>
          <input type="tel" [(ngModel)]="phone" placeholder="Teléfono">
        </div>

        <div class="field">
          <label><i class="bi bi-shield-lock"></i> Rol</label>
          <input type="text" [value]="roleLabel" disabled>
        </div>
      </div>
    </section>

    <!-- Cambiar contraseña -->
    <section class="profile-card">
      <h2 class="card-title"><i class="bi bi-lock"></i> Cambiar contraseña</h2>
      <p class="field-hint">Déjalo en blanco si no quieres cambiarla.</p>

      <div class="form-grid">
        <div class="field">
          <label><i class="bi bi-lock"></i> Nueva contraseña</label>
          <input type="password" [(ngModel)]="password" placeholder="Mínimo 8 caracteres" autocomplete="new-password">
        </div>

        <div class="field">
          <label><i class="bi bi-lock-fill"></i> Confirmar contraseña</label>
          <input type="password" [(ngModel)]="confirmPassword" placeholder="Repite la contraseña" autocomplete="new-password">
        </div>
      </div>

<div class="card-footer">
  <button class="btn-confirm" (click)="saveChanges()" [disabled]="saving">
    {{ saving ? 'Guardando...' : 'Guardar cambios' }}
  </button>
</div>
    </section>
  </ng-container>
</div>

<div class="toast-wrapper" *ngIf="showToastFlag">
  <div class="sigcaz-toast" [class.success]="toastType === 'success'" [class.error]="toastType === 'error'">
    <i class="bi" [class.bi-check-circle-fill]="toastType === 'success'" [class.bi-exclamation-circle-fill]="toastType === 'error'"></i>
    {{ toastMessage }}
  </div>
</div>
