<div class="login-wrapper">

  <div class="login-container">

    <div class="left">
      <div class="logo-wrapper">
        <img src="logo.png" class="logo">
      </div>
    </div>


    <div class="right">

      <h2>INICIAR SESIÓN</h2>
      <p>Ingresa tu correo electrónico y contraseña para iniciar sesión.</p>

      <div class="form" [class.shake]="loginError" [class.success]="loginSuccess">

        <div class="input-group">
          <label>Correo Electrónico</label>
          <input type="text" [(ngModel)]="email" placeholder="correo@ejemplo.com">
        </div>

        <div class="input-group">
          <label>Contraseña</label>

          <div class="password-shell" [class.has-error]="loginError">
            <input [type]="showPassword ? 'text' : 'password'" [(ngModel)]="password" placeholder="********">

            <button type="button" class="toggle-password" (click)="togglePasswordVisibility()"
              [attr.aria-label]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'">
              <i class="bi" [ngClass]="showPassword ? 'bi-eye' : 'bi-eye-slash'"></i>
            </button>
          </div>
        </div>

        <button [class.success]="loginSuccess" [disabled]="loading || loginSuccess" (click)="login()">
          <i class="bi bi-check-circle-fill" *ngIf="loginSuccess"></i>
          {{ loginSuccess ? '¡Bienvenido!' : (loading ? 'Iniciando sesión...' : 'Iniciar Sesión') }}
        </button>

          <button class="bbtn-back" (click)="backToHome()">
    Regresar
  </button>

      </div>

    </div>

    <div class="bottom-cut"></div>

    <div class="toast"
         *ngIf="showToastFlag"
         [class.success]="toastType === 'success'"
         [class.error]="toastType === 'error'">
      {{ toastMessage }}
    </div>

  </div>


</div>
